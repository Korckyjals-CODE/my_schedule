<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule Calendar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Authentication Section -->
    <div id="authSection" class="auth-section" style="display: none;">
        <div class="auth-container">
            <h2>Welcome to Schedule Editor</h2>
            <div id="loginForm" class="auth-form">
                <h3>Sign In</h3>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button id="loginButton">Sign In</button>
                <p>Don't have an account? <a href="#" id="showSignUpLink">Sign Up</a></p>
            </div>
            <div id="signupForm" class="auth-form" style="display: none;">
                <h3>Sign Up</h3>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <button id="signupButton">Sign Up</button>
                <p>Already have an account? <a href="#" id="showLoginLink">Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="appSection" class="app-section" style="display: none;">
        <div class="app-header">
            <h1>Class Schedule Calendar</h1>
            <div class="header-controls">
                <!-- Quick Search Bar -->
                <div class="quick-search-container">
                    <input type="text" id="quickSearchInput" placeholder="Quick search grades, subjects..." class="quick-search-input">
                    <button id="quickSearchBtn" class="quick-search-btn" title="Search">🔍</button>
                </div>
                <div class="user-info">
                    <span id="userEmail"></span>
                    <button id="signoutButton" class="signout-btn">Sign Out</button>
                </div>
            </div>
        </div>
        
        <div class="container">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <h2 id="monthDisplay"></h2>
                    <button id="nextMonth">&gt;</button>
                    <button id="editSchedule" class="edit-button">Edit Schedule</button>
                    <button id="searchButton" class="search-button">Search</button>
                </div>
                <div class="weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendar" class="calendar-grid"></div>
            </div>
            <div class="schedule-container">
                <h3 id="selectedDate"></h3>
                <div id="scheduleList" class="schedule-list"></div>
            </div>
        </div>
    </div>

    <!-- Edit Event Modal -->
    <div id="editEventModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Event</h2>
                <span class="close" id="closeEditModalBtn">&times;</span>
            </div>
            <div class="modal-body">
                <form id="editEventForm">
                    <div class="form-group">
                        <label for="editDay">Day:</label>
                        <select id="editDay" required>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="editGrade">Grade:</label>
                        <select id="editGrade" required>
                            <option value="">None</option>
                            <option value="PKA">PKA</option>
                            <option value="PKB">PKB</option>
                            <option value="KA">KA</option>
                            <option value="KB">KB</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="1A">1A</option>
                            <option value="1B">1B</option>
                            <option value="2A">2A</option>
                            <option value="2B">2B</option>
                            <option value="3A">3A</option>
                            <option value="3B">3B</option>
                            <option value="4A">4A</option>
                            <option value="4B">4B</option>
                            <option value="5A">5A</option>
                            <option value="5B">5B</option>
                            <option value="6A">6A</option>
                            <option value="6B">6B</option>
                            <option value="7A">7A</option>
                            <option value="8A">8A</option>
                            <option value="9A">9A</option>
                            <option value="10A">10A</option>
                            <option value="11A">11A</option>
                            <option value="12A">12A</option>
                            <option value="DC1A">DC1A</option>
                            <option value="DC1B">DC1B</option>
                            <option value="DC2A">DC2A</option>
                            <option value="DC2B">DC2B</option>
                            <option value="DC3A">DC3A</option>
                            <option value="DC3B">DC3B</option>
                            <option value="DC1">DC1</option>
                            <option value="DC2">DC2</option>
                            <option value="DC3">DC3</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="editStartTime">Start Time:</label>
                        <input type="time" id="editStartTime" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editEndTime">End Time:</label>
                        <input type="time" id="editEndTime" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editSubject">Subject:</label>
                        <select id="editSubject" required>
                            <option value="Class">Class</option>
                            <option value="Recess">Recess</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Assembly">Assembly</option>
                            <option value="Form Period">Form Period</option>
                            <option value="Holiday">Holiday</option>
                            <option value="Dismissal">Dismissal</option>
                            <option value="Field Trip">Field Trip</option>
                            <option value="Morning Door">Morning Door</option>
                            <option value="Morning Duty">Morning Duty</option>
                            <option value="Recess Duty">Recess Duty</option>
                            <option value="Lunch Duty">Lunch Duty</option>
                            <option value="Dismissal Duty">Dismissal Duty</option>
                            <option value="Dismissal Door">Dismissal Door</option>
                            <option value="Prep">Prep</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="editSpecificDate">Specific Date (optional):</label>
                        <input type="date" id="editSpecificDate">
                        <small>Leave empty for weekday schedule, or specify a date for specific date schedule</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
                <button type="button" id="saveEditBtn" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Load Supabase CDN first -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
