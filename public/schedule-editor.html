<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Editor</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .editor-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-button {
            background: #6c757d !important;
        }
        .editor-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #f0f0f0;
            cursor: pointer;
        }

        .tab-button.active {
            background: #007bff;
            color: white;
        }

        .editor-section {
            display: none;
        }

        .editor-section.active {
            display: block;
        }

        .schedule-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: grid;
            gap: 10px;
        }

        .schedule-entries {
            display: grid;
            gap: 10px;
        }

        .schedule-entry {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 2fr auto;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            align-items: center;
        }

        .entry-controls {
            display: flex;
            gap: 10px;
        }

        select, input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button.delete {
            background: #dc3545;
        }

        button:hover {
            opacity: 0.9;
        }

        .save-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            background: #28a745;
            color: white;
            display: none;
        }

        .schedule-entry input[type="time"] {
            width: 100%;
        }

        @media (max-width: 768px) {
            .schedule-entry {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="editor-header">
            <h1>Schedule Editor</h1>
            <button onclick="window.location.href='index.html'" class="back-button">Back to Calendar</button>
        </div>
        <div class="editor-tabs">
            <button class="tab-button active" data-tab="weekday">Weekday Schedule</button>
            <button class="tab-button" data-tab="specific">Specific Dates</button>
        </div>

        <div id="weekdayEditor" class="editor-section active">
            <div class="form-group">
                <label for="weekday">Select Day:</label>
                <select id="weekday">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
            </div>
            <div id="weekdaySchedule" class="schedule-entries"></div>
            <button onclick="addWeekdayEntry()">Add Entry</button>
        </div>

        <div id="specificEditor" class="editor-section">
            <div class="form-group">
                <label for="specificDate">Select Date:</label>
                <input type="date" id="specificDate">
            </div>
            <div id="specificSchedule" class="schedule-entries"></div>
            <button onclick="addSpecificEntry()">Add Entry</button>
        </div>
    </div>

    <div id="saveStatus" class="save-status">Changes saved!</div>
    <script src="js/editor.js"></script>
</body>
</html>
