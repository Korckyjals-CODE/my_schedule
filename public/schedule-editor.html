<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Editor</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .editor-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-button {
            background: #6c757d !important;
        }
        .editor-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #f0f0f0;
            cursor: pointer;
        }

        .tab-button.active {
            background: #007bff;
            color: white;
        }

        .editor-section {
            display: none;
        }

        .editor-section.active {
            display: block;
        }

        .schedule-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: grid;
            gap: 10px;
        }

        .schedule-entries {
            display: grid;
            gap: 10px;
        }

        .schedule-entry {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 2fr auto;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            align-items: center;
        }

        .entry-controls {
            display: flex;
            gap: 10px;
        }

        select, input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .save-btn {
            background: #28a745;
        }

        .save-btn:hover {
            background: #218838;
        }

        .save-status {
            display: none;
            padding: 10px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .auth-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .auth-form button {
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-form button:hover {
            background: #0056b3;
        }

        .auth-form a {
            color: #007bff;
            text-decoration: none;
        }

        .auth-form a:hover {
            text-decoration: underline;
        }

        .app-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .signout-btn {
            background: #6c757d;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .signout-btn:hover {
            background: #5a6268;
        }

        .weekdays-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .weekday-tag {
            background: #e9ecef;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            color: #495057;
        }

        .weekday-tag.weekday {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .event-creation-form {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .event-creation-form h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #495057;
        }

        .event-creation-form .form-group {
            margin-bottom: 15px;
        }

        .event-creation-form .form-group:last-child {
            margin-bottom: 0;
        }

        .event-creation-form button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <!-- Authentication Section -->
    <div id="authSection" class="auth-section" style="display: none;">
        <div class="auth-container">
            <h2>Schedule Editor</h2>
            <div id="loginForm" class="auth-form">
                <h3>Sign In</h3>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button onclick="handleLogin()">Sign In</button>
                <p>Don't have an account? <a href="#" onclick="showSignUp()">Sign Up</a></p>
            </div>
            <div id="signupForm" class="auth-form" style="display: none;">
                <h3>Sign Up</h3>
                <input type="text" id="signupName" placeholder="Full Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
                <div class="terms-checkbox">
                    <label>
                        <input type="checkbox" id="signupTerms" required>
                        I agree to the <a href="#" onclick="showTerms()">Terms of Service</a>
                    </label>
                </div>
                <button onclick="handleSignUp()">Sign Up</button>
                <p>Already have an account? <a href="#" onclick="showLogin()">Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- Main Editor Section -->
    <div id="appSection" class="app-section" style="display: none;">
        <div class="app-header">
            <h1>Schedule Editor</h1>
            <div class="user-info">
                <span id="userEmail"></span>
                <button onclick="handleSignOut()" class="signout-btn">Sign Out</button>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor-header">
                <button onclick="window.location.href='index.html'" class="back-button">← Back to Calendar</button>
                <button onclick="window.location.href='search.html'" class="search-button">Search</button>
                <button onclick="saveSchedule()" class="save-btn">Save Schedule</button>
            </div>

            <div id="saveStatus" class="save-status">Schedule saved successfully!</div>

            <div class="editor-tabs">
                <button class="tab-button active" data-tab="weekday">Weekday Schedule</button>
                <button class="tab-button" data-tab="specific">Specific Dates</button>
                <button class="tab-button" data-tab="range">Date Range</button>
                <button class="tab-button" data-tab="image">Image Upload</button>
            </div>

            <!-- Weekday Schedule Editor -->
            <div id="weekdayEditor" class="editor-section active">
                <div class="schedule-form">
                    <div class="form-group">
                        <label for="weekday">Select Weekday:</label>
                        <select id="weekday">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                        </select>
                    </div>
                    <div id="weekdaySchedule" class="schedule-entries"></div>
                    <button onclick="addWeekdayEntry()">Add Entry</button>
                </div>
            </div>

            <!-- Specific Date Schedule Editor -->
            <div id="specificEditor" class="editor-section">
                <div class="schedule-form">
                    <div class="form-group">
                        <label for="specificDate">Select Date:</label>
                        <input type="date" id="specificDate">
                    </div>
                    <div id="specificSchedule" class="schedule-entries"></div>
                    <button onclick="addSpecificEntry()">Add Entry</button>
                </div>
            </div>

            <!-- Date Range Schedule Editor -->
            <div id="rangeEditor" class="editor-section">
                <div class="schedule-form">
                    <div class="form-group">
                        <label for="rangeStartDate">Start Date:</label>
                        <input type="date" id="rangeStartDate">
                    </div>
                    <div class="form-group">
                        <label for="rangeEndDate">End Date:</label>
                        <input type="date" id="rangeEndDate">
                    </div>
                    <div class="form-group">
                        <label>Weekdays in Range:</label>
                        <div id="rangeWeekdays" class="weekdays-preview"></div>
                    </div>
                    
                    <!-- Event Creation Form -->
                    <div id="rangeEventForm" class="event-creation-form" style="display: none;">
                        <h4>Create Event for Date Range</h4>
                        <div class="form-group">
                            <label for="rangeGrade">Grade:</label>
                            <select id="rangeGrade">
                                <option value="None">None</option>
                                <option value="PKA">PKA</option>
                                <option value="PKB">PKB</option>
                                <option value="KA">KA</option>
                                <option value="KB">KB</option>
                                <option value="PA">PA</option>
                                <option value="PB">PB</option>
                                <option value="1A">1A</option>
                                <option value="1B">1B</option>
                                <option value="2A">2A</option>
                                <option value="2B">2B</option>
                                <option value="3A">3A</option>
                                <option value="3B">3B</option>
                                <option value="4A">4A</option>
                                <option value="4B">4B</option>
                                <option value="5A">5A</option>
                                <option value="5B">5B</option>
                                <option value="6A">6A</option>
                                <option value="6B">6B</option>
                                <option value="7A">7A</option>
                                <option value="8A">8A</option>
                                <option value="9A">9A</option>
                                <option value="10A">10A</option>
                                <option value="11A">11A</option>
                                <option value="12A">12A</option>
                                <option value="DC1A">DC1A</option>
                                <option value="DC1B">DC1B</option>
                                <option value="DC2A">DC2A</option>
                                <option value="DC2B">DC2B</option>
                                <option value="DC3A">DC3A</option>
                                <option value="DC3B">DC3B</option>
                                <option value="DC1">DC1</option>
                                <option value="DC2">DC2</option>
                                <option value="DC3">DC3</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="rangeStartTime">Start Time:</label>
                            <input type="time" id="rangeStartTime" value="08:00">
                        </div>
                        <div class="form-group">
                            <label for="rangeEndTime">End Time:</label>
                            <input type="time" id="rangeEndTime" value="08:45">
                        </div>
                        <div class="form-group">
                            <label for="rangeSubject">Subject:</label>
                            <select id="rangeSubject">
                                <option value="Class">Class</option>
                                <option value="Recess">Recess</option>
                                <option value="Lunch">Lunch</option>
                                <option value="Assembly">Assembly</option>
                                <option value="Form Period">Form Period</option>
                                <option value="Holiday">Holiday</option>
                                <option value="Dismissal">Dismissal</option>
                                <option value="Field Trip">Field Trip</option>
                                <option value="Morning Door">Morning Door</option>
                                <option value="Morning Duty">Morning Duty</option>
                                <option value="Recess Duty">Recess Duty</option>
                                <option value="Lunch Duty">Lunch Duty</option>
                                <option value="Dismissal Duty">Dismissal Duty</option>
                                <option value="Dismissal Door">Dismissal Door</option>
                                <option value="Prep">Prep</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <button onclick="addRangeEntry()" class="save-btn">Add Event to All Weekdays</button>
                            <button onclick="cancelRangeEvent()" class="delete-btn">Cancel</button>
                        </div>
                    </div>
                    
                    <div id="rangeSchedule" class="schedule-entries"></div>
                    <button onclick="showRangeEventForm()" id="showRangeFormBtn">Create New Event</button>
                </div>
            </div>

            <!-- Image Upload Editor -->
            <div id="imageEditor" class="editor-section">
                <div class="schedule-form">
                    <div class="form-group">
                        <label for="imageUpload">Upload Schedule Image:</label>
                        <input type="file" id="imageUpload" accept="image/*">
                        <button onclick="extractScheduleFromImage()">Extract Schedule</button>
                    </div>
                    <div id="imagePreview"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Supabase CDN first -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/ui-utils.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
